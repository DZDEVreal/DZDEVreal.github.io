<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — dz.dev</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23000'/%3E%3Ctext x='16' y='22' font-family='Inter,sans-serif' font-size='18' font-weight='600' fill='%23fff' text-anchor='middle'%3Edz%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    :root {
      color-scheme: light;
      --bg: #fafafa; --text: #171717; --code: #e5e5e5;
      --msg: #737373; --btn-border: #e5e5e5; --btn-bg: #ffffff; --btn-text: #525252;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #0e0e0e; --text: #e5e5e5; --code: #1f1f1f;
        --msg: #8a8a8a; --btn-border: #262626; --btn-bg: #171717; --btn-text: #9c9c9c;
      }
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg); color: var(--text);
      -webkit-font-smoothing: antialiased;
      display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 32px;
    }
    .code { font-size: 5rem; font-weight: 600; color: var(--code); line-height: 1; margin-bottom: 8px; }
    .msg { font-size: 1rem; color: var(--msg); margin-bottom: 32px; }
    a {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.85rem; color: var(--btn-text); text-decoration: none;
      border: 1px solid var(--btn-border); padding: 10px 20px; border-radius: 6px;
      background: var(--btn-bg);
      transition: color 0.15s ease, border-color 0.15s ease;
    }
    a:hover { color: var(--text); border-color: #d4d4d4; }
  </style>
</head>
<body>
  <div>
    <div class="code">404</div>
    <p class="msg">Nothing here.</p>
    <a href="/">&larr; Back home</a>
  </div>
</body>
</html>
